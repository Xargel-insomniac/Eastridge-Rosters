<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Eastridge Primecare doctors' duty roster: monthly rosters, swaps and coverage checks.">
<title>Eastridge Primecare Roster</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a ward-board — header with the shift key, month bar, tabs, then a day-by-shift board (rows = dates, columns = Morning / Evening / Night). */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --sunk: #e8ecf1;
  --ink: #0b1f33;
  --muted: #586779;
  --line: #d5dce5;
  --accent: #0f3556;
  --accent-ink: #ffffff;
  --accent-soft: #e0e9f3;
  --brand-navy: #041f34;
  --brand-red: #e5261f;
  --hero-ink: #ffffff;
  --m: #9a6400; --m-bg: #fcefd2; --m-line: #f0d08a;
  --e: #b0432b; --e-bg: #fbe2da; --e-line: #f1b3a2;
  --n: #4446a3; --n-bg: #e3e4f8; --n-line: #b9bcef;
  --bad: #b42318; --bad-bg: #fdecea;
  --warn: #9a4d00; --warn-bg: #fff1dc;
  --ok: #17704a; --ok-bg: #def5e8;
  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08121c; --surface: #0f1d2b; --sunk: #142536; --ink: #e4ebf2; --muted: #93a3b4; --line: #22364a;
  --accent: #8cc2f2; --accent-ink: #04192b; --accent-soft: #15314c;
  --brand-navy: #041f34; --brand-red: #ff4d45; --hero-ink: #ffffff;
  --m: #f2b54a; --m-bg: #3a2b0f; --m-line: #6b5120;
  --e: #f38c72; --e-bg: #3c1f18; --e-line: #6e3628;
  --n: #a2a5f6; --n-bg: #23254a; --n-line: #3e4180;
  --bad: #ff8a80; --bad-bg: #3d1a17; --warn: #f7b155; --warn-bg: #3a2810; --ok: #5edb9b; --ok-bg: #12321f;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #08121c; --surface: #0f1d2b; --sunk: #142536; --ink: #e4ebf2; --muted: #93a3b4; --line: #22364a;
  --accent: #8cc2f2; --accent-ink: #04192b; --accent-soft: #15314c;
  --brand-navy: #041f34; --brand-red: #ff4d45; --hero-ink: #ffffff;
  --m: #f2b54a; --m-bg: #3a2b0f; --m-line: #6b5120;
  --e: #f38c72; --e-bg: #3c1f18; --e-line: #6e3628;
  --n: #a2a5f6; --n-bg: #23254a; --n-line: #3e4180;
  --bad: #ff8a80; --bad-bg: #3d1a17; --warn: #f7b155; --warn-bg: #3a2810; --ok: #5edb9b; --ok-bg: #12321f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 0.82rem; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }

/* masthead: large photo hero on the home page, slim sticky bar everywhere else */
.masthead { position: relative; isolation: isolate; overflow: hidden; background: var(--brand-navy); color: var(--hero-ink); min-height: clamp(280px, 40vw, 440px); display: grid; grid-template-rows: auto 1fr; transition: min-height .45s cubic-bezier(.2,.7,.2,1), background-color .3s; }
.masthead .photo { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; transform-origin: 60% 45%; animation: drift 18s ease-out both; transition: opacity .35s; }
.masthead::before { content: ""; position: absolute; inset: 0; z-index: -1; transition: opacity .35s;
  background: linear-gradient(180deg, rgba(4,31,52,.55) 0%, rgba(4,31,52,0) 28%), linear-gradient(0deg, rgba(4,31,52,.92) 0%, rgba(4,31,52,.55) 38%, rgba(4,31,52,0) 70%); }
@keyframes drift { from { transform: scale(1.12); } to { transform: scale(1.0); } }
.mast-inner { width: 100%; max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mast-top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding-block: 18px; }
.brand { display: flex; gap: 14px; align-items: center; min-width: 0; }
.logo-plate { display: block; background: #ffffff; border-radius: 14px; padding: 10px 16px; box-shadow: 0 10px 30px rgba(4,31,52,.35); line-height: 0; transition: padding .45s cubic-bezier(.2,.7,.2,1), border-radius .45s, box-shadow .3s; }
.logo { display: block; height: clamp(64px, 9vw, 96px); width: auto; max-width: 100%; transition: height .45s cubic-bezier(.2,.7,.2,1); }
.bar-title { font-family: var(--f-display); font-weight: 600; font-size: 1rem; white-space: nowrap; padding-left: 14px; border-left: 1px solid var(--line); display: none; }
.who { display: flex; gap: 4px 10px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; border-radius: 999px; padding: 4px 6px 4px 14px; background: rgba(4,31,52,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.18); }
.who:empty { display: none; }
.who b { font-weight: 600; }
.masthead:not(.compact) .who .btn.ghost { color: #ffffff; }
.masthead:not(.compact) .who .btn.ghost:hover { border-color: rgba(255,255,255,.4); }
.masthead:not(.compact) .who .pill.done { background: var(--brand-red); color: #ffffff; }
.hero-copy { align-self: end; padding-block: 8px 32px; display: grid; gap: 8px; max-width: 1080px; animation: rise .8s .15s cubic-bezier(.2,.7,.2,1) both; }
.hero-copy > * { max-width: 40rem; }
.hero-copy .eyebrow { color: rgba(255,255,255,.82); }
.hero-copy .eyebrow::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--brand-red); margin-right: 8px; vertical-align: 1px; }
.hero-copy h1 { font-size: clamp(1.9rem, 4.6vw, 3.2rem); letter-spacing: -0.02em; line-height: 1.05; }
.hero-copy p { font-size: 1.02rem; color: rgba(255,255,255,.88); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
/* compact */
.masthead.compact { min-height: 0; background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; overflow: visible; }
.masthead.compact .photo, .masthead.compact::before { opacity: 0; }
.masthead.compact .mast-top { padding-block: 8px; }
.masthead.compact .logo-plate { padding: 4px 6px; box-shadow: none; border-radius: 8px; }
.masthead.compact .logo { height: 38px; }
.masthead.compact .bar-title { display: block; }
.masthead.compact .who { background: transparent; border-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; padding-left: 0; }
.masthead.compact .hero-copy { display: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

.key { display: flex; flex-wrap: wrap; gap: 8px; }
.keyitem { display: flex; gap: 8px; align-items: baseline; padding: 6px 12px; border-radius: 999px; border: 1px solid; font-size: 0.85rem; }
.keyitem b { font-weight: 600; }
.sh-M { color: var(--m); background: var(--m-bg); border-color: var(--m-line); }
.sh-E { color: var(--e); background: var(--e-bg); border-color: var(--e-line); }
.sh-N { color: var(--n); background: var(--n-bg); border-color: var(--n-line); }

/* banners */
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid var(--line); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner p { min-width: 0; flex: 1 1 260px; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.ghost:hover { border-color: var(--line); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* month bar + tabs */
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.month { display: flex; align-items: center; gap: 4px; }
.month h2 { min-width: 10.5em; text-align: center; font-size: 1.3rem; }
.iconbtn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.1rem; line-height: 1; }
.iconbtn:hover { border-color: var(--accent); }
.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 10px; overflow-x: auto; max-width: 100%; }
.tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: var(--surface); font-size: 0.72rem; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.count.soft { background: var(--line); color: var(--ink); }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; align-items: start; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.stat { display: grid; }
.stat b { font-family: var(--f-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 0.78rem; color: var(--muted); }
.stat.bad b { color: var(--bad); }
.stat.warn b { color: var(--warn); }
.stat.okc b { color: var(--ok); }
a.statlink, button.statlink { all: unset; cursor: pointer; display: grid; border-radius: 6px; }
button.statlink:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* form */
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lab { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
input[type=text], input[type=tel], input[type=date], input[type=email], input[type=password], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
textarea { font-family: var(--f-mono); font-size: 0.82rem; min-height: 90px; resize: vertical; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.row > .field { flex: 1 1 180px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.88rem; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* board */
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.filters select, .bar select { width: auto; max-width: 100%; }
.check { min-width: 0; max-width: 100%; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 0.9rem; cursor: pointer; }
.boardwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.board { display: grid; grid-template-columns: minmax(84px, 108px) repeat(3, minmax(0, 1fr)); min-width: 0; }
.bh { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; padding: 10px; font-size: 0.8rem; font-weight: 700; border-bottom: 1px solid var(--line); background: var(--surface); display: grid; }
.bh .mono { font-weight: 500; font-size: 0.72rem; opacity: .85; }
.bh.sh-M, .bh.sh-E, .bh.sh-N { border-width: 0 0 1px 0; border-style: solid; }
.bd { padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 0.85rem; display: grid; align-content: start; }
.bd b { font-family: var(--f-display); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.bd.we { background: var(--sunk); }
.bd.today b::after { content: "today"; margin-left: 6px; font-family: var(--f-body); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-ink); background: var(--accent); padding: 1px 5px; border-radius: 4px; vertical-align: 2px; }
.bc { padding: 6px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px; align-content: start; min-width: 0; }
.bc.we { background: var(--sunk); }
.bc.gap { background: var(--bad-bg); }
.gaptag { color: var(--bad); font-weight: 700; font-size: 0.78rem; padding: 2px 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; border: 1px solid; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--surface); }
.chip small { font-weight: 500; opacity: .75; }
.chip.mine { outline: 2px solid var(--accent); outline-offset: 0; cursor: pointer; }
.chip.flag::before { content: "!"; display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--warn); color: var(--surface); font-size: 0.65rem; font-weight: 800; }
button.chip { font: inherit; font-size: 0.8rem; font-weight: 600; }
.chip.c-M { color: var(--m); border-color: var(--m-line); }
.chip.c-E { color: var(--e); border-color: var(--e-line); }
.chip.c-N { color: var(--n); border-color: var(--n-line); }

/* calendar editor */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: center; padding: 2px 0; }
.cday { border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: grid; gap: 3px; background: var(--surface); min-width: 0; }
.cday.we { background: var(--sunk); }
.cday.flag { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.cday .dn { font-family: var(--f-display); font-weight: 600; font-size: 0.85rem; font-variant-numeric: tabular-nums; padding-left: 2px; }
.cday.blank { border: 0; background: transparent; }
.tg { border: 1px dashed var(--line); background: transparent; border-radius: 5px; padding: 2px 0; font-weight: 700; font-size: 0.75rem; cursor: pointer; color: var(--muted); width: 100%; }
.tg:hover { border-style: solid; }
.tg.on { border-style: solid; }
.tg.on.M { color: var(--m); background: var(--m-bg); border-color: var(--m-line); }
.tg.on.E { color: var(--e); background: var(--e-bg); border-color: var(--e-line); }
.tg.on.N { color: var(--n); background: var(--n-bg); border-color: var(--n-line); }
.tg:disabled { cursor: not-allowed; }

/* lists */
.list { display: grid; gap: 8px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; background: var(--surface); min-width: 0; }
.item .head { display: flex; gap: 8px; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.pill.pending { background: var(--warn-bg); color: var(--warn); }
.pill.accepted, .pill.done { background: var(--ok-bg); color: var(--ok); }
.pill.declined, .pill.cancelled, .pill.failed { background: var(--sunk); color: var(--muted); }
.note { font-size: 0.85rem; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 6px 8px; }
.note.bad { color: var(--bad); background: var(--bad-bg); }
.note.ok { color: var(--ok); background: var(--ok-bg); }
.empty { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); display: grid; gap: 10px; justify-items: center; }
details > summary { cursor: pointer; font-weight: 600; }
pre.tpl { margin: 0; padding: 10px; background: var(--sunk); border-radius: 8px; overflow-x: auto; font-family: var(--f-mono); font-size: 0.8rem; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 2px; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 20; }

@media (max-width: 560px) {
  .masthead { min-height: 300px; }
  .logo { height: 56px; }
  .logo-plate { padding: 8px 12px; border-radius: 12px; }
  .masthead.compact .logo { height: 30px; }
  .bar-title { display: none !important; }
  .month h2 { min-width: 0; font-size: 1.1rem; }
  .board { grid-template-columns: 62px repeat(3, minmax(0, 1fr)); }
  .bd { padding: 6px; font-size: 0.75rem; }
  .bh { padding: 8px 6px; }
  .chip small { display: none; }
  .tg { font-size: 0.68rem; }
  .cal { gap: 2px; }
  .cday { padding: 2px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="masthead" id="masthead">
  <img class="photo" src="assets/hospital.webp" srcset="assets/hospital-900.webp 900w, assets/hospital.webp 1803w" sizes="100vw" alt="" fetchpriority="high">
  <div class="mast-inner mast-top">
    <div class="brand">
      <span class="logo-plate"><img class="logo" src="assets/eastridge-logo.png" alt="Eastridge Primecare, a project of FFH" width="502" height="207"></span>
      <span class="bar-title">Doctors' duty roster</span>
    </div>
    <div class="who" id="who"></div>
  </div>
  <div class="mast-inner hero-copy">
    <span class="eyebrow">Eastridge Primecare · Medical staff</span>
    <h1>Doctors' duty roster</h1>
    <p>Upload your month, swap or hand over duties, and see who's on for every shift across the hospital.</p>
  </div>
</header>

<div class="wrap">

  <div class="key" aria-label="Shift times">
    <span class="keyitem sh-M"><b>Morning</b><span class="mono">08:00 – 14:00</span></span>
    <span class="keyitem sh-E"><b>Evening</b><span class="mono">14:00 – 20:00</span></span>
    <span class="keyitem sh-N"><b>Night</b><span class="mono">20:00 – 08:00 next day</span></span>
  </div>

  <div id="banner"></div>

  <div class="bar" id="bar" hidden>
    <div class="month">
      <button class="iconbtn" id="m-prev" data-act="month" data-d="-1" aria-label="Previous month">‹</button>
      <h2 id="month-label"></h2>
      <button class="iconbtn" id="m-next" data-act="month" data-d="1" aria-label="Next month">›</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>

  <main id="main"></main>
</div>

const SHIFTS = [

  { code: "E", name: "Evening", start: 14, end: 20, hours: 6, time: "14:00 – 20:00" },

function fmtDate(date) { const [, m, d] = date.split("-").map(Number); return DOW[dow(date)] + " " + d + " " + MON_SHORT[m - 1]; }

function ymd(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }

function sortCodes(a) { return CODES.filter(c => a.includes(c)); }
function cloneShifts(s) { const o = {}; for (const k in (s || {})) o[k] = [...s[k]]; return o; }

/* Merge back-to-back shifts and report any run of duty longer than MAX_STRETCH hours. */
function longStretches(shifts, monthK) {
  const iv = dutyList(shifts).map(x => { const base = dayNum(x.date) * 24, s = SHIFT[x.shift]; return { a: base + s.start, b: base + s.end, first: x, last: x }; }).sort((p, q) => p.a - q.a);
  const merged = [];
  for (const i of iv) {
    const l = merged[merged.length - 1];
    if (l && i.a <= l.b) { if (i.b > l.b) { l.b = i.b; l.last = i.last; } }
    else merged.push({ ...i });
  }
  return merged
    .filter(m => m.b - m.a > MAX_STRETCH && (!monthK || m.first.date.startsWith(monthK + "-") || m.last.date.startsWith(monthK + "-")))
    .map(m => ({ hours: m.b - m.a, from: m.first, to: m.last }));
}
function stretchText(st) { return st.hours + " h straight: " + fmtDuty(st.from) + " → " + fmtDuty(st.to); }

/* Validate and compute the rosters after a change. A = requester's shifts, B = colleague's. */
function planChange(req, A, B, names) {
  const g = req.give, from = names.from || "the requester", to = names.to || "the colleague";
  if (!hasDuty(A, g.date, g.shift)) return { error: fmtDuty(g) + " is no longer on " + from + "'s roster." };
  if (req.type === "move") {
    const t = req.take;
    if (hasDuty(A, t.date, t.shift)) return { error: from + " is already on duty for " + fmtDuty(t) + "." };
    return { A: withDuty(withoutDuty(A, g.date, g.shift), t.date, t.shift) };
  }
  if (req.type === "cover") {
    if (hasDuty(B, g.date, g.shift)) return { error: to + " is already on duty for " + fmtDuty(g) + "." };
    return { A: withoutDuty(A, g.date, g.shift), B: withDuty(B, g.date, g.shift) };
  }
  if (req.type === "swap") {
    const t = req.take;
    if (!hasDuty(B, t.date, t.shift)) return { error: fmtDuty(t) + " is no longer on " + to + "'s roster." };
    if (hasDuty(A, t.date, t.shift)) return { error: from + " is already on duty for " + fmtDuty(t) + "." };
    if (hasDuty(B, g.date, g.shift)) return { error: to + " is already on duty for " + fmtDuty(g) + "." };
    return { A: withDuty(withoutDuty(A, g.date, g.shift), t.date, t.shift), B: withDuty(withoutDuty(B, t.date, t.shift), g.date, g.shift) };
  }

}

/* ---- file parsing ---- */
function parseCSV(text) {
  text = String(text || "").replace(/^﻿/, "");
  const first = text.split(/\r?\n/).find(l => l.trim()) || "";
  const delim = [",", "\t", ";"].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;

}
const SHIFT_WORDS = { m: "M", morning: "M", morn: "M", mor: "M", am: "M", e: "E", evening: "E", eve: "E", ev: "E", pm: "E", n: "N", night: "N", nite: "N", nt: "N", ngt: "N" };

  if (/^(off|leave|rest|none|-|—|holiday|al|cl)$/.test(s)) return { codes: [], off: true };

  for (const tok of s.split(/[\s,+\/&]+|\band\b/).filter(Boolean)) {
    if (SHIFT_WORDS[tok]) codes.push(SHIFT_WORDS[tok]);

function monthFromName(s) { const i = MON_SHORT.findIndex(m => s.toLowerCase().startsWith(m.toLowerCase())); return i < 0 ? 0 : i + 1; }
function parseDateCell(v, monthK) {
  const { y: my, m: mm } = parseMonth(monthK);
  if (v instanceof Date && !isNaN(v)) { const t = new Date(v.getTime() + 12 * 3600e3); return validYmd(t.getFullYear(), t.getMonth() + 1, t.getDate()); }

function parseRows(rows, monthK) {

  const find = re => hdr.findIndex(h => re.test(h));

function entriesToShifts(entries) { let s = {}; for (const e of entries) s = withDuty(s, e.date, e.shift); return s; }

/* Per-department coverage for one month. */
function coverageGaps(monthK, doctors, rosterMonth) {
  const byDept = {};
  Object.values(doctors).forEach(d => { const k = d.dept || "No department"; (byDept[k] ||= []).push(d.uid); });
  const out = { gaps: [], notUploaded: [] };
  for (const dept of Object.keys(byDept).sort()) {
    const ids = byDept[dept];
    if (!ids.some(id => rosterMonth[id])) { out.notUploaded.push(dept); continue; }
    for (const date of datesOf(monthK)) for (const c of CODES) {
      if (!ids.some(id => hasDuty(rosterMonth[id], date, c))) out.gaps.push({ dept, date, shift: c });

  return out;
}

const app = { db: null, user: null, uid: null, isOwner: false, canEdit: false, canWrite: null, readOnly: false, sample: false, live: false, loading: true, busy: false, phase: "starting", myDoc: null, isAdmin: false, email: "", allDoctors: {}, liveDoctors: {} };

/* ---------- storage (Firebase Firestore) ---------- */
let unsubDoctors = null, unsubRosters = null, unsubRequests = null, unsubMe = null;
function onDbError(e) {

  else if (e && e.code === "unavailable") setTimeout(subscribeMonth, 3000);
  render();
}
function subscribeMonth() {
  if (!app.db || app.phase !== "app") return;
  if (unsubRosters) unsubRosters();
  if (unsubRequests) unsubRequests();
  const ms = [addMonths(state.month, -1), state.month];
  unsubRosters = app.db.collection("rosters").where("month", "in", ms).onSnapshot(snap => {
    if (app.sample) return;
    const r = {};
    snap.docs.forEach(d => { const x = d.data(); if (x && x.month && x.doctorId) (r[x.month] ||= {})[x.doctorId] = x.shifts || {}; });
    state.rosters = r; app.loading = false; render();
  }, onDbError);

    if (app.sample) return;
    state.requests = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

async function dbCall(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 500 + Math.random() * 800)); return await fn(); }
    throw e;
  }
}
async function guarded(fn, okMsg) {
  if (app.busy) return false;
  app.busy = true; render();
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === "permission-denied") toast("You don't have permission to do that. Ask the roster coordinator to approve your account.");
    else if (code === "resource-exhausted") toast("The database's free daily limit is used up. Try again tomorrow, or ask the coordinator to upgrade the Firebase plan.");
    else toast("Couldn't save: " + ((e && e.message) || "check your connection and try again."));

  } finally { app.busy = false; render(); }
}
const store = {

    if (app.myDoc) await dbCall(() => ref.set({ uid, ...data, updatedAt: Date.now() }, { merge: true }));
    else await dbCall(() => ref.set({ uid, ...data, email: app.email || "", approved: false, createdAt: Date.now(), updatedAt: Date.now() }));
  },
  async setApproved(uid, approved) { await dbCall(() => app.db.collection("doctors").doc(uid).update({ approved, updatedAt: Date.now() })); },
  async removeDoctor(uid) { await dbCall(() => app.db.collection("doctors").doc(uid).delete()); },
  async getRoster(month, id) {
    if (app.sample) return cloneShifts(rosterOf(month, id) || {});
    const s = await dbCall(() => app.db.collection("rosters").doc(month + "_" + safeId(id)).get());
    return s.exists ? cloneShifts(s.data().shifts || {}) : {};
  },
  async saveRoster(month, id, shifts) {

    await dbCall(() => app.db.collection("rosters").doc(month + "_" + safeId(id)).set({ month, doctorId: id, shifts, updatedAt: Date.now(), updatedBy: app.uid }));
  },

};

  const c = err && err.code;
  return ({
    "auth/invalid-credential": "Wrong email or password.", "auth/wrong-password": "Wrong email or password.",
    "auth/user-not-found": "No account with that email. Create one instead.",
    "auth/email-already-in-use": "There's already an account with that email. Sign in instead.",
    "auth/weak-password": "Use a password of at least 6 characters.", "auth/invalid-email": "That email address doesn't look right.",
    "auth/missing-password": "Enter your password.", "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again.",
    "auth/network-request-failed": "No connection. Check your internet and try again.",
    "auth/popup-closed-by-user": "The Google window was closed before signing in.",
    "auth/unauthorized-domain": "This website isn't allowed to sign in yet. Add it under Firebase Authentication → Settings → Authorized domains.",
    "auth/operation-not-allowed": "This sign-in method isn't turned on in Firebase yet.",
  })[c] || ((err && err.message) || "Sign-in failed. Try again.");
}

let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return (xlsxPromise ||= new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => res(window.XLSX); s.onerror = () => { xlsxPromise = null; rej(new Error("Couldn't load the Excel reader.")); };
    document.head.appendChild(s);
  }));
}
async function readFile(file) {
  try {
    let rows;
    if (/\.xlsx?$/i.test(file.name)) {
      const XLSX = await loadXLSX();
      const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" });
    } else rows = parseCSV(await file.text());
    state.upload = reparse({ fileName: file.name, rows });
    if (!state.upload.entries.length && !state.upload.skipped.length && !Object.keys(state.upload.otherMonths).length) toast("That file has no duties in it. Check it has a date column and a shift column.");
  } catch (err) { toast("Couldn't read " + file.name + ": " + (err.message || "unknown error") + ". Save it as CSV and try again."); }
  render();
}

/* ---------- start ---------- */
function startLive() {
  subscribeMonth();
  if (!unsubDoctors) unsubDoctors = app.db.collection("doctors").limit(1000).onSnapshot(snap => {
    const all = {}; snap.docs.forEach(x => { const v = x.data(); if (v && v.uid) all[v.uid] = v; });
    app.allDoctors = all;
    app.liveDoctors = Object.fromEntries(Object.entries(all).filter(([, v]) => v.approved === true));
    if (app.sample) return;
    state.doctors = app.liveDoctors; render();
  }, onDbError);
}
function stopLive() {
  [unsubDoctors, unsubRosters, unsubRequests].forEach(u => u && u());
  unsubDoctors = unsubRosters = unsubRequests = null;
  state.doctors = {}; state.rosters = {}; state.requests = []; state.drafts = {}; state.upload = null; state.editFor = null;
  app.allDoctors = {}; app.liveDoctors = {};
}
/* Decide what a signed-in person sees: profile setup, waiting for approval, or the roster. */
function decidePhase() {
  const d = app.myDoc, member = app.isAdmin || (d && d.approved === true);
  if (member) { if (app.phase !== "app") { app.phase = "app"; app.loading = true; startLive(); } }
  else {
    if (app.phase === "app") stopLive();
    if (!d && app.phase !== "profile") state.profile = { name: "", dept: "", phone: "" };
    app.phase = d ? "pending" : "profile";
  }
  render();
}
function init() {
  const cfg = window.FIREBASE_CONFIG;
  app.googleOn = !!window.ROSTER_GOOGLE_SIGNIN;
  if (!window.firebase) { app.phase = "setup"; app.setupError = "Couldn't load Firebase. Check your internet connection and reload the page."; render(); return; }
  if (!cfg || !cfg.apiKey || /PASTE/i.test(cfg.apiKey)) { app.phase = "setup"; render(); return; }
  try {
    firebase.initializeApp(cfg); app.db = firebase.firestore(); app.auth = firebase.auth();
    const emu = window.FIREBASE_EMULATOR; // local testing only
    if (emu) { app.auth.useEmulator("http://" + emu.host + ":" + emu.authPort); app.db.useEmulator(emu.host, emu.firestorePort); }
  }
  catch (e) { app.phase = "setup"; app.setupError = "The settings in firebase-config.js look wrong: " + e.message; render(); return; }
  render();
  app.auth.onAuthStateChanged(async u => {
    if (unsubMe) { unsubMe(); unsubMe = null; }
    stopLive();
    app.sample = false; app.myDoc = null; app.isAdmin = false; app.canEdit = false; app.loading = true; state.profileOpen = false;
    if (!u) { app.uid = app.realUid = null; app.busy = false; state.auth = { mode: "signin", email: state.auth.email, password: "", err: "", msg: "" }; app.phase = "auth"; render(); return; }
    app.uid = app.realUid = u.uid; app.email = u.email || "";
    state.auth.password = ""; state.auth.err = state.auth.msg = "";
    app.phase = "starting"; render();
    try { app.isAdmin = (await app.db.collection("admins").doc(u.uid).get()).exists; } catch (_) { app.isAdmin = false; }
    app.canEdit = app.isAdmin;
    unsubMe = app.db.collection("doctors").doc(u.uid).onSnapshot(snap => { app.myDoc = snap.exists ? snap.data() : null; decidePhase(); },
      e => { app.phase = "setup"; app.setupError = "Couldn't read your account (" + ((e && (e.code || e.message)) || "unknown error") + "). Check that the Firestore rules from the README are published."; render(); });
  });
}
init();
</script>
